<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>เศรษฐีมีโชค — วินเลข</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* ---------- themes ---------- */
  :root{
    --red:#ef4d5a; --green:#2bb88a;
    /* neutrals (light) */
    --page:#f6f9fd; --card:#ffffff; --ink:#34406b; --muted:#7f8bb0; --num:#000; --inbg:#fff;
    --glass:rgba(255,255,255,.72); --glassline:rgba(255,255,255,.9);
    --soft:0 18px 40px -18px rgba(70,110,200,.35),0 4px 12px -6px rgba(70,110,200,.15);
    /* accent: ฟ้า (default) */
    --accent:#2386f5; --accent2:#45c4f0; --pill:#2fa8e6; --bg:#bde9f8;
    --grad:linear-gradient(135deg,#45c4f0 0%,#4fd6c9 55%,#55dfa6 100%);
    --blob:linear-gradient(160deg,#1877f6,#2f9cf7);
    --chip:color-mix(in srgb,var(--accent2) 11%,var(--card));
    --tint:color-mix(in srgb,var(--accent2) 14%,var(--card));
    --line:color-mix(in srgb,var(--accent2) 30%,var(--card));
    --panel:linear-gradient(180deg,color-mix(in srgb,var(--accent2) 14%,var(--page)) 0%,color-mix(in srgb,var(--accent2) 7%,var(--page)) 100%);
  }
  [data-theme="mint"]{--accent:#1f9a6b;--accent2:#3cc48f;--pill:#27ae7a;--bg:#c6efdc;
    --grad:linear-gradient(135deg,#3cc48f 0%,#7fd7a8 55%,#c4e98f 100%);--blob:linear-gradient(160deg,#138a5c,#2fb07c)}
  [data-theme="rose"]{--accent:#e0457b;--accent2:#f47aa3;--pill:#ec5b8e;--bg:#fbd7e4;
    --grad:linear-gradient(135deg,#f47aa3 0%,#f9a3b8 55%,#ffc8a8 100%);--blob:linear-gradient(160deg,#d02f6a,#ef5f93)}
  [data-theme="grape"]{--accent:#7c4ddb;--accent2:#a58bf0;--pill:#8b62e6;--bg:#e1d8fb;
    --grad:linear-gradient(135deg,#a58bf0 0%,#b9a4f5 50%,#f0a8d8 100%);--blob:linear-gradient(160deg,#6534cf,#8f6bf0)}
  [data-theme="sunset"]{--accent:#e8731c;--accent2:#f6a04d;--pill:#f08a2c;--bg:#fde2c6;
    --grad:linear-gradient(135deg,#f6a04d 0%,#f8c36b 55%,#ffdf8a 100%);--blob:linear-gradient(160deg,#dd5f12,#f5872f)}
  [data-mode="dark"]{
    --page:#121a2b; --card:#1a2438; --ink:#e4eaf7; --muted:#93a0bd; --num:#f3f6fc; --inbg:#0e1524;
    --glass:rgba(26,36,56,.82); --glassline:rgba(255,255,255,.08);
    --soft:0 18px 40px -18px rgba(0,0,0,.6),0 4px 12px -6px rgba(0,0,0,.35);
    --bg:#0a101c;
  }
  [data-mode="dark"] .hero{filter:saturate(.9) brightness(.82)}
  [data-mode="dark"] .badge.no{background:rgba(43,184,138,.18);color:#5fe0b2}
  [data-mode="dark"] .badge.yes{background:rgba(239,77,90,.2);color:#ff8a94}
  [data-mode="dark"] .hero h1 span{background:rgba(255,255,255,.95)}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:"Prompt",system-ui,sans-serif;line-height:1.55;-webkit-font-smoothing:antialiased;min-height:100vh}
  .wrap{position:relative;max-width:680px;margin:0 auto;padding:0 0 60px;background:var(--page);min-height:100vh;box-shadow:0 0 60px -20px color-mix(in srgb,var(--accent) 45%,transparent);transition:background .25s}
  body{transition:background .25s}
  @media (min-width:700px){ body{padding:16px 0} .wrap{border-radius:28px;overflow:hidden;min-height:auto} }
  .inner{padding:0 18px}

  /* ---------- hero with blobs ---------- */
  .hero{position:relative;overflow:hidden;background:var(--grad);color:#fff;padding:18px 14px 56px;text-align:center;border-radius:0 0 28px 28px}
  .hero::before{content:"";position:absolute;width:340px;height:340px;right:-120px;top:-170px;border-radius:50%;background:var(--blob)}
  .hero::after{content:"";position:absolute;width:280px;height:280px;left:-140px;bottom:-170px;border-radius:50%;background:rgba(255,255,255,.14)}
  .hero > *{position:relative;z-index:1}
  .hero h1{margin:0;font:700 20px/1.15 "Prompt",sans-serif;letter-spacing:.01em}
  .hero h1 span{display:inline-block;background:#fff;color:var(--accent);border-radius:12px;padding:0 12px;margin-left:6px;font-size:.8em;vertical-align:4px;transform:rotate(-5deg);box-shadow:0 3px 8px -2px rgba(0,40,100,.3)}
  .hero p{margin:2px 0 0;font-size:12px;opacity:.95}

  /* ---------- input (glass) ---------- */
  .input-box{position:relative;z-index:2;margin:-36px 0 14px;padding:12px 12px 8px;text-align:center;border-radius:20px;
    background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1.5px solid var(--glassline);box-shadow:var(--soft)}
  .lbl{font:600 14px "Prompt",sans-serif;margin-bottom:6px}
  .lbl em{font-style:normal;color:inherit}
  .big-in{width:100%;max-width:220px;font:600 28px "Prompt",sans-serif;letter-spacing:.26em;text-indent:.26em;text-align:center;padding:6px 12px;
    border:0;border-radius:14px;background:var(--inbg);color:var(--num);outline:none;box-shadow:inset 0 2px 6px rgba(52,64,107,.08),0 0 0 2px var(--line);transition:.15s}
  .big-in:focus{box-shadow:inset 0 2px 6px rgba(52,64,107,.08),0 0 0 3px var(--accent2)}
  .opts{display:flex;justify-content:center;flex-wrap:wrap;gap:6px;margin:8px 0 2px}
  .chk{position:relative;cursor:pointer;user-select:none}
  .chk input{position:absolute;opacity:0;pointer-events:none}
  .chk span{display:inline-flex;align-items:center;gap:6px;font:500 13px "Prompt",sans-serif;padding:3px 10px 3px 6px;border-radius:99px;background:var(--tint);color:var(--ink);transition:.15s}
  .chk span::before{content:"";width:15px;height:15px;border-radius:5px;background:var(--inbg);box-shadow:inset 0 0 0 1.5px var(--line)}
  .chk input:checked + span{background:color-mix(in srgb,var(--accent2) 24%,var(--card))}
  .chk input:checked + span::before{content:"✓";display:grid;place-items:center;font-size:12px;font-weight:700;color:#fff;background:var(--accent);box-shadow:none}
  .chk input:focus-visible + span{outline:2px solid var(--accent2);outline-offset:2px}
  [hidden]{display:none!important}
  .dup-warn{display:table;margin:10px auto 0;padding:6px 14px;border-radius:12px;background:var(--red);color:#fff;
    font:600 15px/1.4 "Prompt",sans-serif;box-shadow:0 6px 16px -6px rgba(239,77,90,.7);animation:shake .4s ease}
  .dup-warn b{display:inline-block;min-width:24px;margin-left:5px;padding:0 6px;border-radius:7px;background:#fff;color:var(--red);font-weight:700;text-align:center}
  .big-in.has-dup{box-shadow:inset 0 2px 6px rgba(52,64,107,.08),0 0 0 3px var(--red)!important}
  @keyframes shake{20%,60%{transform:translateX(-4px)}40%,80%{transform:translateX(4px)}}
  .reset{margin-top:4px;border:0;background:transparent;color:var(--muted);font:500 13px "Prompt",sans-serif;padding:2px 10px;cursor:pointer;border-radius:99px}
  .reset:hover{color:var(--ink);background:var(--tint)}

  .wait{text-align:center;color:var(--muted);font-size:13.5px;padding:6px 0 2px}
  .wait b{color:var(--red)}
  .wait .ico{font-size:20px;display:block}

  /* ---------- cards ---------- */
  .card{background:var(--card);border-radius:14px;padding:8px 12px;margin-bottom:8px;box-shadow:var(--soft)}
  @keyframes pulse{50%{transform:scale(1.03)}}
  @keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .card-h{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:8px;flex-wrap:wrap;text-align:center}
  .card-h h3{margin:0;font:600 18px "Prompt",sans-serif;display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:center;flex:none;min-width:0}
  .badge{font:500 12.5px "Prompt",sans-serif;padding:1px 9px;border-radius:99px}
  .badge.no{background:#dcf7ec;color:#1f9a70}
  .badge.yes{background:#ffe5e8;color:var(--red)}
  .count{font:500 12.5px "Prompt",sans-serif;color:var(--muted);text-align:center;margin-top:6px}
  

  .nums{font:600 14px/1.6 "Prompt",sans-serif;font-variant-numeric:tabular-nums;letter-spacing:.02em;color:#000;word-break:break-word}
  .nums i{font-style:normal;color:#9aa6c4;margin:0 1px;font-weight:400}
  .nums.sm{font-weight:500;word-spacing:3px}
  .nums.tbl{white-space:nowrap;overflow-x:auto;font-size:13px;line-height:1.55}
  .chips{display:flex;flex-wrap:wrap;justify-content:center;gap:4px}
  .chips .chip{width:42px}
  .chip{font:500 13.5px/22px "Prompt",sans-serif;font-variant-numeric:tabular-nums;letter-spacing:.03em;color:var(--num);background:var(--chip);border-radius:6px;text-align:center}
  .chips.sm .chip{width:40px}
  .chips.sm .chip{font-size:13px}
  .tbl{display:grid;grid-template-columns:repeat(10,1fr);gap:3px}
  .tbl .chip{font-size:12px;line-height:20px;border-radius:5px}

  .copy{display:flex;align-items:center;justify-content:center;gap:6px;flex:none;width:auto;min-width:88px;min-height:33px;padding:0 11px;margin:0;border:0;
    background:var(--pill);color:#fff;font:600 14px "Prompt",sans-serif;letter-spacing:.02em;border-radius:99px;cursor:pointer;
    box-shadow:0 8px 18px -10px color-mix(in srgb,var(--accent) 80%,transparent);touch-action:manipulation;-webkit-tap-highlight-color:transparent;transition:transform .08s,filter .15s,background .2s}
  .copy .ic{font-size:15px;line-height:1}
  .copy:hover{filter:brightness(1.05)}
  .copy:active{transform:scale(.97)}
  .copy.done{background:var(--grad);animation:pulse .35s ease}

  /* ---------- reference ---------- */
  .section-title{text-align:center;margin:14px 0 8px;font:600 16px "Prompt",sans-serif}
  .section-title small{display:block;font:400 12px "Prompt",sans-serif;color:var(--muted)}
  .ref-panel{margin-top:18px;padding:12px 10px 10px;border-radius:20px;background:var(--panel);
    border:1.5px solid var(--line);box-shadow:inset 0 1px 0 var(--glassline)}
  .ref-panel .section-title{margin:2px 0 10px;font-size:18px;font-weight:700}
  .ref-panel .section-title::before,.ref-panel .section-title::after{content:"";display:inline-block;width:28px;height:2px;border-radius:2px;background:var(--line);vertical-align:middle;margin:0 10px}
  .ref-panel .card{box-shadow:0 2px 8px -4px rgba(70,110,200,.25)}
  .ref-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;grid-auto-flow:dense}
  .ref-grid .card{margin:0;padding:8px 12px;border-radius:14px}
  .ref-grid .card.wide{grid-column:1/-1}
  .ref-grid .card-h h3{font-size:18px;font-weight:700}

  .ref-grid .card-h{gap:8px}
  .ref-grid .copy{min-height:31px;min-width:82px;font-size:13.5px;padding:0 10px}

  .pip-btn{position:absolute;top:10px;right:10px;z-index:3;border:0;background:rgba(255,255,255,.95);color:var(--accent);
    font:600 12px "Prompt",sans-serif;padding:4px 10px;border-radius:99px;cursor:pointer;box-shadow:0 6px 14px -6px rgba(0,40,120,.45)}
  .pip-btn:hover{background:#fff}
  .pip-note{background:#fff8e6;color:#7a5b00;border-radius:18px;padding:12px 14px;margin:-8px 0 18px;font-size:14px;text-align:left;box-shadow:var(--soft)}
  .pip-note b{color:var(--red)}
  /* inside the floating window */
  body.in-pip{padding:0;background:var(--page)}
  body.in-pip .wrap{border-radius:0;max-width:none;box-shadow:none;min-height:100vh}
  body.in-pip .hero{padding:12px 12px 56px;border-radius:0 0 24px 24px}
  body.in-pip .hero h1{font-size:19px}
  body.in-pip .hero p{display:none}
  body.in-pip .pip-btn{top:10px;right:10px;padding:5px 10px;font-size:12px}
  body.in-pip .inner{padding:0 10px}
  body.in-pip .ref-grid{grid-template-columns:1fr}
  body.in-pip .big-in{font-size:26px}
  body.in-pip .input-box{margin-top:-44px;padding:10px}
  .pip-ctl{position:fixed;top:8px;right:8px;z-index:10;display:flex;gap:4px;padding:4px;border-radius:99px;background:var(--glass);box-shadow:0 4px 14px -4px rgba(0,40,120,.4);backdrop-filter:blur(8px)}
  .pip-ctl button{width:32px;height:32px;border:0;border-radius:50%;background:var(--tint);color:var(--accent);font:700 17px "Prompt",sans-serif;
    cursor:pointer;display:grid;place-items:center;padding:0}
  .pip-ctl button:hover{filter:brightness(.95)}
  .pip-ctl .zv{align-self:center;min-width:44px;text-align:center;font:600 12.5px "Prompt",sans-serif;color:var(--ink)}
  .pip-ctl button[data-z="x"]{color:var(--red)}
  body.in-pip .hero h1{padding:0}
  body.in-pip .hero{text-align:left}

  /* ---------- login ---------- */
  .login{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:20px;background:var(--grad)}
  .login::before{content:"";position:absolute;width:420px;height:420px;right:-140px;top:-160px;border-radius:50%;background:var(--blob);opacity:.9}
  body.locked .wrap{display:none}
  .login-card{position:relative;width:100%;max-width:340px;margin-top:60px;padding:26px 22px 22px;border-radius:24px;background:var(--glass);
    backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1.5px solid var(--glassline);box-shadow:var(--soft);text-align:center}
  .login-logo{display:inline-block;font:700 15px "Prompt",sans-serif;color:var(--accent);background:var(--card);border-radius:10px;padding:2px 12px;margin-bottom:6px}
  .login-card h2{margin:0 0 16px;font:700 22px "Prompt",sans-serif;color:var(--ink)}
  .login-card label{display:block;text-align:left;font:500 13px "Prompt",sans-serif;color:var(--muted);margin-bottom:12px}
  .login-card input:not([type=checkbox]){display:block;width:100%;margin-top:4px;padding:10px 12px;border:0;border-radius:12px;background:var(--inbg);color:var(--num);
    font:500 16px "Prompt",sans-serif;outline:none;box-shadow:0 0 0 2px var(--line)}
  .login-card input:focus{box-shadow:0 0 0 3px var(--accent2)}
  .pw{position:relative;display:block}
  .pw input{padding-right:62px!important}
  .eye{position:absolute;right:6px;top:50%;transform:translateY(-50%);margin-top:2px;border:0;background:var(--tint);color:var(--accent);font:600 12px "Prompt",sans-serif;padding:4px 9px;border-radius:8px;cursor:pointer}
  .login-card .remember{display:flex;align-items:center;gap:6px;color:var(--ink)}
  .remember input{accent-color:var(--accent);width:15px;height:15px}
  .login-err{margin:-2px 0 10px;padding:6px 10px;border-radius:10px;background:var(--red);color:#fff;font:600 13px "Prompt",sans-serif;animation:shake .4s ease}
  .login-btn{width:100%;min-height:44px;border:0;border-radius:99px;background:var(--pill);color:#fff;font:600 16px "Prompt",sans-serif;cursor:pointer;
    box-shadow:0 8px 18px -10px color-mix(in srgb,var(--accent) 80%,transparent)}
  .login-btn:active{transform:scale(.98)}
  .hbar{position:absolute;top:10px;right:10px;z-index:3;display:flex;gap:6px}
  .hb{border:0;background:rgba(255,255,255,.95);color:var(--accent);font:600 12px "Prompt",sans-serif;padding:4px 10px;border-radius:99px;cursor:pointer;box-shadow:0 6px 14px -6px rgba(0,40,120,.45);white-space:nowrap}
  .hb:hover{background:#fff}
  .hbar .pip-btn{position:static;box-shadow:0 6px 14px -6px rgba(0,40,120,.45)}
  .who{font:500 11.5px "Prompt",sans-serif;opacity:.95;margin-top:4px}
  .who b{background:rgba(255,255,255,.25);padding:0 7px;border-radius:99px;font-weight:600}
  body.in-pip .hbar{display:none}
  .hero{padding-top:44px!important}
  body.in-pip .hero{padding-top:14px!important}

  /* ---------- permission modal ---------- */
  .modal{position:fixed;inset:0;z-index:60;display:grid;place-items:center;padding:16px;background:rgba(10,20,40,.45);backdrop-filter:blur(4px)}
  .modal-card{width:100%;max-width:520px;max-height:90vh;overflow-y:auto;overflow-x:hidden;background:var(--card);color:var(--ink);border-radius:22px;padding:16px 16px 14px;box-shadow:var(--soft);animation:in .2s ease both}
  .modal-h{display:flex;align-items:center;justify-content:space-between}
  .modal-h h2{margin:0;font:700 19px "Prompt",sans-serif}
  .x{border:0;background:var(--tint);color:var(--ink);width:32px;height:32px;border-radius:50%;cursor:pointer;font-size:14px}
  .hint{font-size:12.5px;color:var(--muted);margin:4px 0 12px}
  .hint b{color:var(--ink)}
  .ulist{display:flex;flex-direction:column;gap:6px}
  .urow{display:grid;grid-template-columns:1fr auto auto auto;gap:6px;align-items:center;padding:8px 10px;border-radius:12px;background:var(--chip)}
  .urow .nm{font:600 14px "Prompt",sans-serif;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .urow .nm small{display:block;font:400 11px "Prompt",sans-serif;color:var(--muted)}
  .uadd input{min-width:0;width:100%}
  .urow select,.uadd select,.uadd input{font:500 13px "Prompt",sans-serif;padding:6px 8px;border-radius:9px;border:0;background:var(--inbg);color:var(--ink);box-shadow:0 0 0 1.5px var(--line);outline:none}
  .uadd input:focus,.uadd select:focus,.urow select:focus{box-shadow:0 0 0 2px var(--accent2)}
  .sbtn{border:0;background:var(--inbg);color:var(--ink);font:600 12px "Prompt",sans-serif;padding:6px 9px;border-radius:9px;cursor:pointer;box-shadow:0 0 0 1.5px var(--line)}
  .sbtn.del{color:var(--red)}
  .sbtn:disabled{opacity:.4;cursor:not-allowed}
  .uadd{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) auto auto;gap:6px;margin-top:14px;padding-top:12px;border-top:1px dashed var(--line)}
  .uadd-t{grid-column:1/-1;font:600 14px "Prompt",sans-serif}
  .pbtn{border:0;background:var(--pill);color:#fff;font:600 13px "Prompt",sans-serif;padding:7px 12px;border-radius:99px;cursor:pointer;white-space:nowrap}
  .pbtn.ghost{background:var(--tint);color:var(--accent)}
  .pbtn.danger{color:var(--red)}
  .perm-msg{margin-top:10px;padding:6px 10px;border-radius:10px;font:500 13px "Prompt",sans-serif;background:var(--tint)}
  .perm-msg.err{background:var(--red);color:#fff}
  .sync{margin-top:14px;padding:10px 12px;border-radius:14px;background:color-mix(in srgb,#f5b400 14%,var(--card));font-size:12.5px;line-height:1.5}
  .sync.ok{background:var(--chip)}
  .sync-b{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}

  @media (max-width:520px){ .hero .hero-logo{height:42px;width:54px;left:10px;top:46px} .hb .lg{display:none} }
  /* ---------- theme controls ---------- */
  .tbar{position:absolute;top:10px;left:10px;z-index:6;display:flex;gap:6px}
  .tbtn{width:30px;height:30px;border:0;border-radius:50%;background:rgba(255,255,255,.95);cursor:pointer;display:grid;place-items:center;
    font-size:15px;line-height:1;box-shadow:0 6px 14px -6px rgba(0,40,120,.45);padding:0;transition:transform .1s}
  .tbtn:active{transform:scale(.92)}
  .tbtn svg{width:17px;height:17px;fill:none;stroke:var(--accent);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .tbtn svg .f{fill:var(--accent);stroke:none}
  .tpop{position:absolute;top:44px;left:10px;z-index:7;display:flex;gap:8px;padding:8px 10px;border-radius:99px;background:var(--card);box-shadow:var(--soft);
    border:1px solid var(--line);animation:in .2s ease both}
  .sw{width:26px;height:26px;border-radius:50%;border:0;cursor:pointer;padding:0;box-shadow:inset 0 0 0 2px rgba(255,255,255,.7);transition:transform .1s}
  .sw:hover{transform:scale(1.1)}
  .sw.on{box-shadow:0 0 0 2px var(--card),0 0 0 4px var(--ink)}
  .sw[data-t="sky"]{background:linear-gradient(135deg,#45c4f0,#2386f5)}
  .sw[data-t="mint"]{background:linear-gradient(135deg,#7fd7a8,#1f9a6b)}
  .sw[data-t="rose"]{background:linear-gradient(135deg,#f9a3b8,#e0457b)}
  .sw[data-t="grape"]{background:linear-gradient(135deg,#b9a4f5,#7c4ddb)}
  .sw[data-t="sunset"]{background:linear-gradient(135deg,#ffd27a,#e8731c)}
  footer{text-align:center;color:var(--muted);font-size:12.5px;margin-top:36px}
  @media (max-width:520px){
    .pip-btn{display:none}
    .hero h1{font-size:22px}
    .big-in{font-size:27px}
    .ref-grid{grid-template-columns:1fr}
    .tbl{gap:3px}
    .tbl .chip{font-size:11px;border-radius:5px}
    .chip{font-size:13px}
  }
</style>

(() => {

  const DEFAULT_USERS = [{"name": "seattee1", "role": "admin", "hash": "ca70cbffb842c88dc4c9bf2fb3be7bc19138f4087c2d5908c1df9500ee0c782a"}, {"name": "seattee2", "role": "user", "hash": "b36b2218c3ee421449096baab9f7275ca82690fe9cd58a6e20cd186bbdd2347e"}, {"name": "seattee3", "role": "user", "hash": "56c2412a5d3051197df969d89ba7c72f1f5ddd3cbc4ecfb27d9253dc63bf0e37"}, {"name": "seattee4", "role": "user", "hash": "ba90f123b8b5b9b55fa17b3458cf1d18ebccaefd07376c9c185d19fc6cf346e7"}, {"name": "seattee5", "role": "user", "hash": "c8e6dd618c7ae3553441df639b653ea3f31be1fac1e9c6fe90e8f17d0e551459"}, {"name": "seattee6", "role": "user", "hash": "f4ff8fccbd0309b51e4942385d653bf1cea8e09bf763142ae454ac23bfcd5054"}, {"name": "seattee7", "role": "user", "hash": "e287b07965c96ffabb40dbb3193543a95781a8b6407e069aa1a515deb1e39df0"}, {"name": "seattee8", "role": "user", "hash": "2778cd4dd302c72207a1053e40b9426958546a34974df5f94e9d3a8dc860a1e6"}, {"name": "seattee9", "role": "user", "hash": "82f633d99ee267953234b413d86620fbf6664dc7b3137f711498771e6826a905"}, {"name": "seattee10", "role": "user", "hash": "874680b18e036732ea1ec42b405bd24fc30fae45d5e5b1fff50f5ac2a5455b03"}, {"name": "seattee8888", "role": "admin", "hash": "7713dda0d5f6f3183044c9d5aa88f20f9919110503e97eeefbd2c06fbb80626d"}];

  function sha256hex(str){

    b.set(msg); b[l] = 0x80; const dv = new DataView(b.buffer); dv.setUint32(nb - 4, l * 8); dv.setUint32(nb - 8, Math.floor(l / 0x20000000));
    const W = new Uint32Array(64), r = (x, n) => (x >>> n) | (x << (32 - n));

  async function loadUsers(){
    try {
      const r = await fetch('users.json', { cache: 'no-store' });
      if (r.ok){ const j = await r.json(); if (Array.isArray(j.users) && j.users.length) baseUsers = j.users; }
    } catch {}
    const loc = sget(localStorage, LOCAL_USERS);
    if (loc){ try { users = JSON.parse(loc); hasLocal = true; } catch { users = clone(baseUsers); } }
    else users = clone(baseUsers);
  }
  function saveLocal(){
    sset(localStorage, LOCAL_USERS, JSON.stringify(users)); hasLocal = true;
    // จำ session ของตัวเองไว้ถ้ารหัสตัวเองถูกเปลี่ยน
    renderPerm();
  }
  const findByHash = h => users.find(u => u.hash === h);

  function unlock(u){
    me = u; document.body.classList.remove('locked'); loginEl.hidden = true;
    mainWrap.querySelector('#permBtn').hidden = u.role !== 'admin';
    mainWrap.querySelector('#whoLine').innerHTML = `เข้าสู่ระบบ: <b>${esc(u.name)} · ${ROLE_TH[u.role]}</b>`;
    setTimeout(() => mainWrap.querySelector('#win')?.focus(), 30);
  }
  function lock(){
    me = null; permModal.hidden = true;
    document.body.classList.add('locked'); loginEl.hidden = false;
    document.getElementById('lgPass').value = ''; document.getElementById('lgPass').focus();
  }
  function logout(){
    sset(localStorage, AUTH_KEY, null); sset(sessionStorage, AUTH_KEY, null);
    if (pipWin && !pipWin.closed) pipWin.close();
    lock();
  }

  document.getElementById('loginForm').addEventListener('submit', e => {
    e.preventDefault();
    const h = sha256hex(document.getElementById('lgPass').value);
    const u = findByHash(h), err = document.getElementById('lgErr');
    if (!u){ err.hidden = true; void err.offsetWidth; err.hidden = false; document.getElementById('lgPass').select(); return; }
    err.hidden = true;
    sset(document.getElementById('lgRemember').checked ? localStorage : sessionStorage, AUTH_KEY, h);
    unlock(u);
  });
  document.getElementById('lgEye').addEventListener('click', e => {
    const i = document.getElementById('lgPass'), show = i.type === 'password';
    i.type = show ? 'text' : 'password'; e.target.textContent = show ? 'ซ่อน' : 'แสดง';
  });
  mainWrap.querySelector('#logoutBtn').addEventListener('click', logout);

  /* ----- หน้าตั้งค่าสิทธิ์ (เฉพาะสิทธิ์ดูแล) ----- */
  const admins = () => users.filter(u => u.role === 'admin').length;
  function msg(t, bad){ const m = $m('#permMsg'); m.textContent = t; m.className = 'perm-msg' + (bad ? ' err' : ''); m.hidden = false; clearTimeout(msg.t); msg.t = setTimeout(() => m.hidden = true, 3500); }
  const usersJson = () => JSON.stringify({ users }, null, 2) + '\n';
  function renderPerm(){
    $m('#uList').innerHTML = users.map((u, i) => {
      const isMe = me && u.hash === me.hash;
      const lastAdmin = u.role === 'admin' && admins() === 1;
      return `<div class="urow" data-i="${i}">
        <div class="nm">${esc(u.name)}${isMe ? ' (คุณ)' : ''}<small>สิทธิ์${ROLE_TH[u.role]}</small></div>
        <select class="role" ${lastAdmin ? 'disabled title="ต้องมีผู้ดูแลอย่างน้อย 1 คน"' : ''}>
          <option value="user"${u.role === 'user' ? ' selected' : ''}>ใช้งาน</option>
          <option value="admin"${u.role === 'admin' ? ' selected' : ''}>ดูแล</option>
        </select>
        <button type="button" class="sbtn chg">เปลี่ยนรหัส</button>
        <button type="button" class="sbtn del" ${lastAdmin || isMe ? 'disabled' : ''} title="${isMe ? 'ลบตัวเองไม่ได้' : lastAdmin ? 'ต้องมีผู้ดูแลอย่างน้อย 1 คน' : 'ลบ'}">ลบ</button>
      </div>`;
    }).join('');
    const changed = JSON.stringify(users) !== JSON.stringify(baseUsers);
    const sync = $m('.sync');
    sync.classList.toggle('ok', !changed);
    $m('#syncT').innerHTML = changed
      ? '<b>⚠️ ยังมีผลเฉพาะเครื่องนี้</b> — กด “คัดลอก” หรือ “ดาวน์โหลด” users.json แล้วอัปโหลดทับไฟล์เดิมในรีโป GitHub เพื่อให้มีผลทุกเครื่อง'
      : '✓ รายชื่อตรงกับไฟล์ users.json บนเว็บแล้ว';
    $m('#resetLocal').hidden = !hasLocal;
  }
  mainWrap.querySelector('#permBtn').addEventListener('click', () => { if (me?.role !== 'admin') return; renderPerm(); permModal.hidden = false; });
  $m('#permClose').addEventListener('click', () => permModal.hidden = true);
  permModal.addEventListener('click', e => { if (e.target === permModal) permModal.hidden = true; });

  $m('#uList').addEventListener('change', e => {
    if (!e.target.classList.contains('role')) return;
    const i = +e.target.closest('.urow').dataset.i, u = users[i], nr = e.target.value;
    if (u.role === 'admin' && nr !== 'admin' && admins() === 1){ e.target.value = 'admin'; return msg('ต้องมีผู้ดูแลอย่างน้อย 1 คน', true); }
    u.role = nr; saveLocal(); msg(`เปลี่ยนสิทธิ์ ${u.name} เป็น “${ROLE_TH[nr]}” แล้ว`);
    if (me && u.hash === me.hash){ me.role = nr; unlock(u); if (nr !== 'admin') permModal.hidden = true; }
  });
  $m('#uList').addEventListener('click', e => {
    const row = e.target.closest('.urow'); if (!row) return;
    const i = +row.dataset.i, u = users[i];
    if (e.target.classList.contains('del')){
      if (e.target.dataset.confirm !== '1'){ e.target.dataset.confirm = '1'; e.target.textContent = 'ยืนยันลบ?'; setTimeout(() => { if (e.target.isConnected){ e.target.dataset.confirm = ''; e.target.textContent = 'ลบ'; } }, 3000); return; }
      users.splice(i, 1); saveLocal(); msg(`ลบ ${u.name} แล้ว`);
    }
    if (e.target.classList.contains('chg')){
      const box = document.createElement('div');
      box.className = 'uadd'; box.style.marginTop = '4px'; box.style.paddingTop = '0'; box.style.borderTop = '0';
      box.innerHTML = `<input class="nc" placeholder="รหัสใหม่ของ ${esc(u.name)}" minlength="4"><button type="button" class="pbtn okc">บันทึก</button>`;
      row.after(box); box.querySelector('.nc').focus();
      box.querySelector('.okc').addEventListener('click', () => {
        const v = box.querySelector('.nc').value;
        if (v.length < 4) return msg('รหัสต้องมีอย่างน้อย 4 ตัว', true);
        const h = sha256hex(v);
        if (users.some(x => x.hash === h && x !== u)) return msg('รหัสนี้มีคนใช้แล้ว', true);
        const wasMe = me && u.hash === me.hash;
        u.hash = h; saveLocal(); msg(`เปลี่ยนรหัสของ ${u.name} แล้ว`);
        if (wasMe){ me = u; if (sget(localStorage, AUTH_KEY)) sset(localStorage, AUTH_KEY, h); else sset(sessionStorage, AUTH_KEY, h); }
      });
    }
  });
  $m('#uAdd').addEventListener('submit', e => {
    e.preventDefault();
    const name = $m('#nName').value.trim(), code = $m('#nCode').value, role = $m('#nRole').value;
    if (!name) return;
    if (code.length < 4) return msg('รหัสต้องมีอย่างน้อย 4 ตัว', true);
    const h = sha256hex(code);
    if (users.some(u => u.hash === h)) return msg('รหัสนี้มีคนใช้แล้ว ตั้งรหัสอื่น', true);
    users.push({ name, role, hash: h }); saveLocal();
    $m('#nName').value = ''; $m('#nCode').value = ''; $m('#nRole').value = 'user';
    msg(`เพิ่ม ${name} (สิทธิ์${ROLE_TH[role]}) แล้ว`);
  });
  $m('#copyJson').addEventListener('click', async () => {
    try { await navigator.clipboard.writeText(usersJson()); msg('คัดลอก users.json แล้ว — นำไปวางแทนเนื้อหาไฟล์ users.json บน GitHub'); }
    catch { msg('คัดลอกไม่ได้ ลองกดดาวน์โหลดแทน', true); }
  });
  $m('#dlJson').addEventListener('click', () => {
    try {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([usersJson()], { type: 'application/json' }));
      a.download = 'users.json'; document.body.appendChild(a); a.click(); a.remove();
      msg('ดาวน์โหลดแล้ว — อัปโหลดทับ users.json ในรีโป GitHub');
    } catch { msg('ดาวน์โหลดไม่ได้ในหน้านี้ ใช้ปุ่มคัดลอกแทน', true); }
  });
  $m('#resetLocal').addEventListener('click', () => {
    sset(localStorage, LOCAL_USERS, null); hasLocal = false; users = clone(baseUsers);
    if (me && !findByHash(me.hash)){ logout(); return; }
    renderPerm(); msg('กลับไปใช้รายชื่อจาก users.json แล้ว');
  });

  (async () => {
    await loadUsers();
    const h = sget(localStorage, AUTH_KEY) || sget(sessionStorage, AUTH_KEY);
    const u = h && findByHash(h);
    u ? unlock(u) : lock();
  })();

})();
</script>
</body>
</html>
